<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:30px 32px; display:flex; flex-direction:column; gap:18px;}
  .row{display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  .label{font-family:var(--font-body); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-4); min-width:80px;}
  .btn{font-family:var(--font-body); font-size:14px; font-weight:500; padding:13px 26px; border-radius:999px; border:0; cursor:pointer; line-height:1; letter-spacing:0; transition: all .2s var(--ease-soft);}
  .btn.primary{background:var(--khi-blue); color:#fff; box-shadow: 0 6px 28px rgba(49,107,255,.35);}
  .btn.primary:hover{background:var(--khi-blue-bright);}
  .btn.outline{background:transparent; color:var(--fg-2); border:1px solid var(--border);}
  .btn.outline:hover{border-color:var(--border-blue); color:#fff;}
  .btn.ghost{background:transparent; color:var(--fg-2); padding:13px 16px;}
  .btn.ghost:hover{color:var(--khi-blue-bright);}
  .btn .arr{display:inline-block; margin-left:6px; transform:translateY(-0.5px);}
</style></head>
<body>
  <div class="row"><span class="label">Primary</span>
    <button class="btn primary">Become a Sponsor <span class="arr">→</span></button>
    <button class="btn primary">Register</button>
  </div>
  <div class="row"><span class="label">Outline</span>
    <button class="btn outline">Download Brochure</button>
    <button class="btn outline">View Domains</button>
  </div>
  <div class="row"><span class="label">Ghost</span>
    <button class="btn ghost">Learn more <span class="arr">→</span></button>
  </div>
</body></html>
