<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Stat Numbers</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:24px 24px;}
  .row{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .item{text-align:center; padding:20px 8px; border-right:1px solid var(--border);}
  .item:last-child{border-right:0;}
  .num{font-family:var(--font-display); font-size:54px; font-weight:800; letter-spacing:-0.04em; line-height:1; color:#fff;}
  .num .accent{color:var(--khi-blue);}
  .lbl{font-family:var(--font-body); font-size:12px; color:var(--fg-3); margin-top:6px; letter-spacing:.06em;}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="num">10<span class="accent">K+</span></div><div class="lbl">Attendees</div></div>
    <div class="item"><div class="num">100<span class="accent">+</span></div><div class="lbl">Speakers</div></div>
    <div class="item"><div class="num">50<span class="accent">+</span></div><div class="lbl">Sessions</div></div>
    <div class="item"><div class="num">8</div><div class="lbl">Innovation Zones</div></div>
  </div>
</body></html>
