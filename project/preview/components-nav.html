<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Nav</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#02040A;color:var(--fg-1);}
  body{position:relative; min-height:170px;}
  /* fake hero glow */
  .glow{position:absolute; inset:0; background: radial-gradient(ellipse 60% 80% at 60% 0%, rgba(49,107,255,.22) 0%, transparent 60%); pointer-events:none;}
  nav{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 28px;
    background: rgba(4,11,28,0.7);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .lockup{display:flex; align-items:center; gap:11px;}
  .mark{
    width:34px; height:34px; border-radius:9px;
    background: linear-gradient(135deg,#003ACE,#316BFF);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .mark svg{width:18px; height:18px;}
  .word{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-0.02em;}
  .word em{color:var(--khi-blue); font-style:italic; font-weight:800;}
  ul{display:flex; gap:30px; list-style:none; margin:0; padding:0;}
  li a{font-family:var(--font-body); font-size:13px; color:var(--fg-3); text-decoration:none;}
  li a.active{color:#fff;}
  .cta{font-family:var(--font-body); font-size:13px; padding:9px 20px; border-radius:999px; background:var(--khi-blue); color:#fff; text-decoration:none;}
  .below{padding:24px 28px; position:relative; z-index:1;}
  .pad{font-family:var(--font-body); font-size:11px; color:var(--fg-4); letter-spacing:.18em; text-transform:uppercase;}
</style></head>
<body>
  <div class="glow"></div>
  <nav>
    <div class="lockup">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M6 12l9-8M6 12l9 8M14 6h4v4"/></svg></span>
      <span class="word">Khi<em>next</em></span>
    </div>
    <ul>
      <li><a class="active" href="#">About</a></li>
      <li><a href="#">Domains</a></li>
      <li><a href="#">Sponsors</a></li>
      <li><a href="#">Speakers</a></li>
      <li><a href="#">Team</a></li>
    </ul>
    <a class="cta" href="#">Register</a>
  </nav>
  <div class="below">
    <div class="pad">Fixed · Glass · backdrop-blur(20px) · 1px hairline</div>
  </div>
</body></html>
