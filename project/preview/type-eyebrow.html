<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Eyebrow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:36px 40px; display:flex; flex-direction:column; gap:22px;}
  .tag { display:inline-flex; align-items:center; gap:10px; font-family:var(--font-body); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--khi-blue); font-weight:700;}
  .tag::before { content:''; width:24px; height:2px; background:var(--khi-blue); display:block; }
  .triad { font-family:var(--font-body); font-size:14px; letter-spacing:.42em; text-transform:uppercase; color:var(--fg-1); font-weight:400;}
  .meta { display:flex; gap:14px; align-items:center; font-family:var(--font-body); font-size:13px; color:var(--fg-3);}
  .dot { color:var(--fg-5); }
</style></head>
<body>
  <span class="tag">About the Summit</span>
  <div class="triad">I N N O V A T E . &nbsp;I N S P I R E . &nbsp;I M P A C T</div>
  <div class="meta"><span>Karachi</span><span class="dot">·</span><span>2 Days</span><span class="dot">·</span><span>10,000+ Attendees</span><span class="dot">·</span><span>8 Innovation Zones</span></div>
</body></html>
