<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:28px 32px; display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
  .sw { border-radius:18px; padding:22px 22px 18px; aspect-ratio: 1.4 / 1; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
  .sw .name { font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:-0.02em; }
  .sw .hex  { font-family:ui-monospace,Menlo,monospace; font-size:11px; opacity:.8; }
  .sw.blue { background: var(--khi-blue); color:#fff; box-shadow: 0 0 0 1px rgba(49,107,255,0.25), 0 0 38px rgba(49,107,255,0.45); }
  .sw.ink  { background: var(--khi-ink); color:#fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .sw.white{ background: #FFFFFF; color: var(--khi-ink); }
  .sw .role { font-family:var(--font-body); font-size:10px; letter-spacing:.18em; text-transform:uppercase; opacity:.7; }
</style></head>
<body>
  <div class="sw blue">
    <div class="role">Brand · Accent</div>
    <div>
      <div class="name">Khinext Blue</div>
      <div class="hex">#316BFF</div>
    </div>
  </div>
  <div class="sw ink">
    <div class="role">Background · Base</div>
    <div>
      <div class="name">Ink</div>
      <div class="hex">#040B1C</div>
    </div>
  </div>
  <div class="sw white">
    <div class="role">Foreground · Primary</div>
    <div>
      <div class="name">White</div>
      <div class="hex">#FFFFFF</div>
    </div>
  </div>
</body></html>
