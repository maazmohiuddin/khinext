<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Logo Lockups</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:24px 28px; display:grid; grid-template-columns: 200px 1fr; gap:18px; align-items:center;}
  .panel{background:var(--surface-1); border:1px solid var(--border); border-radius:18px; padding:24px; display:flex; align-items:center; justify-content:center; min-height:120px;}
  .panel.dark{background:#040B1C;}
  .panel.blue{background:var(--khi-blue);}
  .panel.white{background:#fff;}
  img.full{height:46px; width:auto;}
  img.mark{height:64px; width:auto;}
  .col{display:flex; flex-direction:column; gap:14px;}
  .cap{font-family:var(--font-body); font-size:10px; color:var(--fg-4); letter-spacing:.18em; text-transform:uppercase;}
</style></head>
<body>
  <div class="col">
    <div class="panel dark"><img class="mark" src="../assets/logo-mark.png" alt="Khinext mark"></div>
    <div class="cap">Mark only · ink</div>
  </div>
  <div class="col" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
    <div class="panel dark"><img class="full" src="../assets/logo.png" alt="Khinext logo"></div>
    <div class="panel blue"><img class="full" src="../assets/logo.png" alt="Khinext logo" style="filter:brightness(0) invert(1);"></div>
    <div class="panel white"><img class="full" src="../assets/logo.png" alt="Khinext logo"></div>
  </div>
</body></html>
