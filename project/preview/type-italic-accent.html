<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Italic accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:34px 40px;}
  .h {
    font-family:var(--font-display);
    font-size:64px;
    font-weight:800;
    line-height:0.96;
    letter-spacing:-0.04em;
  }
  .h em {
    font-style:italic;
    color:var(--khi-blue);
    font-weight:800;
    position:relative;
    display:inline-block;
  }
  .h em::after {
    content:'';
    position:absolute; inset:18% -10% 18% -10%;
    background: radial-gradient(ellipse at center,
      rgba(143,175,255,0.6) 0%,
      rgba(49,107,255,0.25) 50%,
      transparent 80%);
    filter: blur(18px);
    z-index:-1;
  }
  .h em { isolation:isolate; }
  .caption { margin-top:18px; font-family:var(--font-body); font-size:11px; color:var(--fg-4); letter-spacing:.18em; text-transform:uppercase; }
</style></head>
<body>
  <div class="h">One day. <em>Infinite</em> impact.</div>
  <div class="caption">Helvetica Now Display Extra Bold Italic · #316BFF · one per headline</div>
</body></html>
