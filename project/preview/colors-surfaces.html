<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:28px 32px;}
  .legend { font-family:var(--font-body); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--fg-4); margin-bottom:14px; }
  .row { display:grid; grid-template-columns: repeat(4,1fr); gap:12px; }
  .card { aspect-ratio:1/.8; border-radius:18px; padding:14px; display:flex; flex-direction:column; justify-content:flex-end;}
  .name { font-family:var(--font-display); font-size:14px; font-weight:700; color:#fff; }
  .meta { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--fg-3); margin-top:3px;}

  .c1 { background: var(--surface-3); border:1px solid var(--border); }
  .c2 { background: var(--surface-1); border:1px solid var(--border); }
  .c3 { background: var(--surface-2); border:1px solid var(--border-strong); }
  .c4 { background: rgba(49,107,255,0.06); border:1px solid var(--border-blue); }
</style></head>
<body>
  <div class="legend">Glass surfaces · all on ink #040B1C</div>
  <div class="row">
    <div class="card c1"><div class="name">Faintest</div><div class="meta">surface-3</div></div>
    <div class="card c2"><div class="name">Card</div><div class="meta">surface-1</div></div>
    <div class="card c3"><div class="name">Hover</div><div class="meta">surface-2</div></div>
    <div class="card c4"><div class="name">Tinted</div><div class="meta">blue-glass</div></div>
  </div>
</body></html>
