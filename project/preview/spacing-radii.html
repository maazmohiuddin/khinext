<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:28px 32px;}
  .legend{font-family:var(--font-body);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-4);margin-bottom:16px;}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:end;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:72px;height:72px;background:linear-gradient(135deg,#003ACE 0%,#316BFF 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18);}
  .n{font-family:var(--font-display);font-size:13px;font-weight:700;color:#fff;}
  .v{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--fg-3);}
</style></head>
<body>
  <div class="legend">Corner radii</div>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="n">r-1</div><div class="v">6px · tag</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="n">r-2</div><div class="v">10px · sm</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="n">r-3</div><div class="v">14px · icon</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="n">r-4</div><div class="v">20px · card</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="n">r-5</div><div class="v">24px · lg</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="n">pill</div><div class="v">999 · btn</div></div>
  </div>
</body></html>
