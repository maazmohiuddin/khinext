<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; background:var(--bg); color:var(--fg-1); }
  body { padding: 28px 36px; }
  .row { display:grid; grid-template-columns: 120px 60px 1fr; align-items:baseline; padding: 10px 0; border-bottom: 1px solid var(--border); gap:24px; }
  .row:last-child { border-bottom: 0; }
  .name { font-family:var(--font-body); font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--fg-4); }
  .px   { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--fg-3); }
  .sample { font-family:var(--font-display); color:var(--fg-1); letter-spacing:-0.03em; line-height:1; }
</style></head>
<body>
  <div class="row"><span class="name">H1</span><span class="px">96</span><span class="sample" style="font-size:56px; font-weight:800;">Future starts here</span></div>
  <div class="row"><span class="name">H2</span><span class="px">64</span><span class="sample" style="font-size:44px; font-weight:800;">Karachi, 2026</span></div>
  <div class="row"><span class="name">H3</span><span class="px">44</span><span class="sample" style="font-size:32px; font-weight:700;">8 Innovation Zones</span></div>
  <div class="row"><span class="name">H4</span><span class="px">32</span><span class="sample" style="font-size:24px; font-weight:700;">Choose your tier</span></div>
  <div class="row"><span class="name">H5</span><span class="px">24</span><span class="sample" style="font-size:20px; font-weight:700; font-family:var(--font-body);">Section heading</span></div>
</body></html>
