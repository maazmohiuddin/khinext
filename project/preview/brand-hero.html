<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Hero Background</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0; background:#02040A;}
  body{position:relative; overflow:hidden; min-height:340px;}
  .bg{position:absolute; inset:0; background: url('../assets/glass-hands.png') center / cover no-repeat; opacity:0.85;}
  .mesh{position:absolute; inset:-10%;
    background:
      radial-gradient(closest-side at 88% 30%, rgba(60,40,140,0.35) 0%, transparent 55%),
      radial-gradient(closest-side at 8% 70%, rgba(30,50,120,0.30) 0%, transparent 50%);
    filter: blur(70px);
    mix-blend-mode: soft-light;
    opacity:0.55;
  }
  .grid{position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(49,107,255,0.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(49,107,255,0.16) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 0%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 0%, transparent 80%);
    opacity:0.22;
  }
  .content{position:relative; z-index:2; padding:42px 38px; color:#fff; min-height:340px; display:flex; flex-direction:column; justify-content:flex-end;}
  .eyebrow{font-family:var(--font-body); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--khi-blue-bright); margin-bottom:14px;}
  h1{font-family:var(--font-display); font-size:48px; font-weight:800; letter-spacing:-0.04em; line-height:1; margin:0;}
  h1 em{color:var(--khi-blue); font-style:italic; font-weight:800;}
  .sub{font-family:var(--font-body); font-size:14px; color:var(--fg-2); margin-top:14px; max-width:60%; line-height:1.6;}
</style></head>
<body>
  <div class="bg"></div>
  <div class="mesh"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="eyebrow">Karachi · 2026</div>
    <h1>AI in <em>everything</em>.<br>Future starts here.</h1>
    <p class="sub">Pakistan's first multi-domain AI summit — 10,000+ attendees across 8 innovation zones.</p>
  </div>
</body></html>
