<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Zone Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:26px 22px; display:grid; grid-template-columns:repeat(7,1fr); gap:14px;}
  .icon{
    --c: #fff;
    width:64px; height:64px; border-radius:14px; background:var(--c);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 1px color-mix(in oklab, var(--c) 50%, transparent),
                0 0 24px color-mix(in oklab, var(--c) 50%, transparent);
    margin:0 auto;
  }
  .lbl { text-align:center; font-family:var(--font-display); font-weight:700; font-size:11px; margin-top:8px; color:var(--fg-2); letter-spacing:-0.01em;}
  .item { display:flex; flex-direction:column; }
  /* tight viewBox crops to the shape's bounding box, so the mark
     fills ~75% of the colored square (matches the Figma master). */
  svg { width:60px; height:60px; display:block; }
</style></head>
