<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — FG Tokens</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:28px 32px;}
  .row { display:grid; grid-template-columns: 90px 1fr 90px; align-items:center; gap:18px; padding:11px 0; border-bottom:1px solid var(--border); }
  .row:last-child { border-bottom:0; }
  .tok { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--fg-3); }
  .alpha { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--fg-4); text-align:right; }
  .sample { font-family:var(--font-body); font-size:15px; }
  .s1 { color:var(--fg-1); font-weight:700; }
  .s2 { color:var(--fg-2); }
  .s3 { color:var(--fg-3); }
  .s4 { color:var(--fg-4); text-transform:uppercase; letter-spacing:.18em; font-size:11px; }
  .s5 { color:var(--fg-5); }
</style></head>
<body>
  <div class="row"><span class="tok">--fg-1</span><span class="sample s1">Primary copy &amp; headings</span><span class="alpha">1.00</span></div>
  <div class="row"><span class="tok">--fg-2</span><span class="sample s2">Body paragraph text on dark</span><span class="alpha">0.70</span></div>
  <div class="row"><span class="tok">--fg-3</span><span class="sample s3">Secondary / supporting meta</span><span class="alpha">0.45</span></div>
  <div class="row"><span class="tok">--fg-4</span><span class="sample s4">Eyebrow labels</span><span class="alpha">0.30</span></div>
  <div class="row"><span class="tok">--fg-5</span><span class="sample s5">Watermarks &amp; hairline ghosts</span><span class="alpha">0.15</span></div>
</body></html>
