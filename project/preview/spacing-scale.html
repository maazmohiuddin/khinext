<!doctype html>
<html><head><meta charset="utf-8">
<title>Khinext — Spacing Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg-1);}
  body{padding:28px 32px;}
  .legend{font-family:var(--font-body);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-4);margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:0;}
  .name{width:70px;font-family:var(--font-display);font-weight:700;font-size:13px;}
  .num{width:60px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--fg-3);}
  .bar{height:12px;background:var(--khi-blue);border-radius:3px;box-shadow:0 0 14px rgba(49,107,255,.4);}
</style></head>
<body>
  <div class="legend">Spacing scale · 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96</div>
  <div class="row"><span class="name">space-1</span><span class="num">4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="name">space-2</span><span class="num">8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="name">space-3</span><span class="num">12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="name">space-4</span><span class="num">16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="name">space-5</span><span class="num">24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="name">space-6</span><span class="num">32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="name">space-7</span><span class="num">48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="name">space-8</span><span class="num">64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="name">space-9</span><span class="num">96</span><div class="bar" style="width:96px"></div></div>
</body></html>
